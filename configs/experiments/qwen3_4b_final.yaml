# Ticket 13 / H12: the PRIMARY Qwen3-4B GRPO + LoRA run on the full system: L2L with asynchronous prefetching,
# disk-backed streaming with crash-consistent checkpoints, 8 GB budget. Training pool: 1024 balanced prompts (the
# assignment's 1-2k). 60 updates of B = 5 prompts x G = 6 draw at least 300 prompt selections, i.e. NOT one epoch over
# the pool: the trainer records the prompts actually visited and the zero-signal attempts (training.json "coverage")
# and nothing claims an epoch. The goal is a correct, memory-bounded end-to-end run, not maximal accuracy.
# Subset evaluation and a crash-consistent checkpoint every 20 updates (step0 is the initial adapter): checkpoints
# step0/20/40/60, exactly the ones the DFlash drift study needs (H10.dflash_drift). The validation subset only
# monitors; the held-out test split is touched only by scripts/final_eval.py after training.
# Optional, opt-in only: qwen3_4b_final_ext210.yaml continues THIS run's step-60 checkpoint to 210 updates as a separate
# run (scripts/run.py train --continue-from ...); scripts/run_assignment.sh never starts it.
# Rollouts are DFlash-drafted (z-lab/Qwen3-4B-DFlash-b16, frozen, GPU-resident beside the streamed target) and verified
# token by token by the current LoRA policy through the same L2L executor (qwen_grpo/execution/backend.py ->
# DFlashGenerator); evaluation and the held-out test stay plain greedy decoding. The plain-L2L baseline with this batch
# shape is qwen3_4b_smoke.yaml (dflash disabled there explicitly), the DFlash one qwen3_4b_smoke_dflash.yaml.
# Budget (theoretical): configs/budget/qwen3-4b_final_dflash.yaml -> results/budget/predictions/qwen3-4b-final-dflash_8gb.*
#
# Hyperparameters are explicit overrides here (the shared profile defaults are unchanged). Seed, LoRA rank/alpha/
# targets, bf16, async L2L and DFlash are inherited unchanged.
#   micro_batch_size 6: the B*G = 30 completions of a rollout batch run as 5 micro-batches of 6 (old log-probs and the
#     update, in the same chunks); each chunk's loss is scaled by 6/30, gradients accumulate, and exactly one AdamW
#     step is taken per rollout batch (training.grpo_update; tests/test_multistep.py). Bounds the per-chunk
#     activations, recomputed-layer graph and [n, R+1, V] logits to 6 rows.
#   learning_rate 2e-4 (profile 5e-4): every Qwen3-0.6B run at 5e-4 collapsed toward one label at some point.
#   evaluation.batch_size 16 (profile 32): smaller greedy-evaluation batches during training.
extends: qwen3_4b_l2l.yaml

run:
  name: qwen3_4b_final

data:
  train_samples: 1024
  val_subset: 128

training:
  batch_size: 5
  group_size: 6
  micro_batch_size: 6
  learning_rate: 2.0e-4
  max_steps: 60
  max_attempts: 1000
  num_iterations: 1
  clip_eps: 0.2
  max_new_tokens: 4

evaluation:
  every: 20
  full_validation: false
  batch_size: 16
  score_batch_size: 8

streaming:
  enabled: true
  directory: streaming

dflash:
  enabled: true
  draft_model: z-lab/Qwen3-4B-DFlash-b16
