# Qwen3-0.6B (bf16) through the same code path as the Qwen3-4B runs (L2L async, pinned weight store, disk-backed
# prompt and rollout streaming, crash-consistent checkpoints, resume with --resume latest) at a cost of minutes. Results are not comparable bitwise with the resident reference run unless micro-batching and evaluation
# settings match (H05: qwen3_0.6b_resident.yaml vs qwen3_0.6b_l2l_*.yaml).
#   python scripts/run.py train --config configs/experiments/qwen3_0.6b_streaming.yaml
#   python scripts/run.py train --config runs/qwen3_0.6b_streaming/config.yaml --resume latest   # after an interruption
extends: ../profiles/qwen3_0_6b.yaml

run:
  name: qwen3_0.6b_streaming

data:
  train_samples: 64
  val_subset: 32

training:
  max_steps: 10

evaluation:
  every: 5
  full_validation: false

execution:
  backend: l2l_async
  weight_storage: pinned
  resident_layers: 0
  weight_buffers: 2
  prefetch_depth: 1
  activation_checkpointing: true
  kv_cache: gpu

streaming:
  enabled: true
  directory: streaming
