# Qwen3-4B (36 decoder layers): the default experiment scaled up, for a GPU with more than 4 GB. Untested: the model
# alone needs ~8 GB in bf16, and this repository has not run it. Before validate/test/verify can reuse a saved baseline,
# results/baseline/ must hold one for this model; otherwise the base model is evaluated in-process.
extends: ../default.yaml

run:
  name: qwen3_4b
  gpu_budget_gib: 16.0

model:
  name: Qwen/Qwen3-4B

lora:
  targets:
    modules: [q_proj, v_proj, o_proj]
    num_layers: 2              # layers 34-35
