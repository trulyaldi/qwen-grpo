# Kaggle gpu-train (float32 diagnostic), Qwen3-0.6B, synchronous L2L; otherwise kaggle_06b_fp32_train_resident.yaml.
extends: kaggle_06b_fp32_train_resident.yaml

run:
  name: kaggle_06b_fp32_train_l2l_sync

execution:
  backend: l2l_sync
  weight_storage: pinned
  resident_layers: 0
  weight_buffers: 2
  prefetch_depth: 0
  activation_checkpointing: true
  kv_cache: gpu
