# Qwen3-4B (36 decoder layers): the default experiment scaled up, for a GPU with more than 4 GB. Untested: the model
# alone needs ~8 GB in bf16, and this repository has not run it. Before validate/test/verify can reuse a saved baseline,
# results/baseline/ must hold one for this model; otherwise the base model is evaluated in-process.
run:
  name: qwen3_4b
  gpu_budget_gib: 16.0

model:
  name: Qwen/Qwen3-4B
  dtype: bfloat16
  thinking: false

lora:
  rank: 8
  alpha: 16
  dropout: 0.0
  targets:
    modules: [q_proj, v_proj, o_proj]
    num_layers: 2              # layers 34-35

data:
  train_samples: 32
  val_subset: 160
  subset_seed: 42

training:
  batch_size: 2
  batch_mode: balanced
  group_size: 6
  learning_rate: 1.0e-4
  max_steps: 30
  max_attempts: 300
  clip_eps: 0.2
  temperature: 1.0
  max_new_tokens: 8
  seed: 42
  eval_every: 10
  full_val: true

evaluation:
  max_new_tokens: 4
  batch_size: 32
  score_batch_size: 8
  bootstrap_samples: 10000
  bootstrap_seed: 42
