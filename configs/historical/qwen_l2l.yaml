# configs/qwen.yaml with the synchronous L2L backend (Tickets 03-07): frozen decoder weights in a pinned CPU store,
# streamed layer by layer through 2 GPU buffers, checkpointed backward, streamed generation, full output head.
# Everything else is identical to configs/experiments/qwen_resident.yaml; compare the runs with
#   python scripts/compare_runs.py qwen_resident qwen_l2l
extends: ../qwen.yaml

run:
  name: qwen_l2l

execution:
  backend: l2l_sync
  weight_storage: pinned
  resident_layers: 0
  weight_buffers: 2
  prefetch_depth: 0
  activation_checkpointing: true
  kv_cache: gpu
