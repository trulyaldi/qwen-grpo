# GRPO + LoRA on Qwen3-0.6B: the successful reference run (runs/qwen: validation accuracy 0.7486 -> 0.8096 and ROC AUC
# 0.8277 -> 0.8929 at step 90). Omitted keys take the defaults in qwen_grpo/config.py, listed in README.md.
run:
  name: default

model:
  name: Qwen/Qwen3-0.6B

lora:
  rank: 32
  alpha: 64
  targets: last2-attention   # q/v/o projections of the last two decoder layers (26-27)

data:
  train_samples: 512
  val_subset: 512

training:
  batch_size: 5              # B prompts per rollout batch (shuffled sampler)
  group_size: 6              # G completions per prompt
  learning_rate: 5.0e-4      # write floats with a decimal point: PyYAML reads 5e-4 as a string
  max_steps: 100             # optimizer updates
  max_attempts: 1000         # rollout batches, zero-signal ones included
  max_new_tokens: 4
  seed: 42

evaluation:
  every: 10                  # validation-subset evaluation + checkpoint
  full_validation: true
