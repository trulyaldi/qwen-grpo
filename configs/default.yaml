# GRPO + LoRA on Qwen3-0.6B: the historical "last2 B=2 balanced" run (as default_rerun), and the parent of every
# configs/experiments/*.yaml. Omitted keys take the defaults in qwen_grpo/config.py (listed in README.md).
run:
  name: default

model:
  name: Qwen/Qwen3-0.6B

lora:
  rank: 8
  alpha: 16
  targets: last2-attention   # preset: q/v/o of the last 2 decoder layers (26-27 here); last-o-proj: o_proj of the last
  # targets: {modules: [q_proj, v_proj, o_proj], num_layers: 2}   # the same, written out; any Linear names in a layer

data:
  train_samples: 32
  val_subset: 160

training:
  batch_size: 2
  batch_mode: balanced       # cycle (B=1) | balanced (B=2, one prompt per label) | unconstrained
  group_size: 6
  learning_rate: 1.0e-4      # write floats with a decimal point: PyYAML reads 1e-4 as a string
  max_steps: 30
  max_attempts: 300
  max_new_tokens: 8
  seed: 42
  eval_every: 10
  full_val: true
