# Budget of the final run as it now runs: configs/experiments/qwen3_4b_final.yaml (and qwen3_4b_final_lr0.yaml, and the
# smoke run qwen3_4b_smoke_dflash.yaml, which share its batch shape) WITH DFlash rollouts, resolved, under the
# assignment's cap read as 8e9 bytes. Written after the decision to use DFlash in the final run and before any Qwen3-4B
# measurement; every runtime number is an assumption until measured.
#
# Identical to configs/budget/qwen3-4b_final.yaml except run_name and dflash.enabled. That file and its prediction
# (results/budget/predictions/qwen3-4b-final_8gb.*) are kept unchanged: they describe the same shape with PLAIN
# streamed rollouts, i.e. the plain-L2L baseline (qwen3_4b_smoke.yaml) and the H11.profile run (qwen3_4b_l2l.yaml),
# and they were written before DFlash was enabled in the final run. The Step-0 qwen3-4b.yaml prediction stays a
# historical record. With dflash.enabled the calculator (qwen_grpo/budget/calculator.py) puts the drafter's weights in
# every phase and models the rollout as qwen_grpo/execution/dflash.py implements it (block_size slack in the target KV
# cache, captured target features, LM head over every prompt position at prefill, drafter context cache, block
# verification). tests/test_assignment_provenance.py checks this file against the resolved final config.
run_name: qwen3-4b-final-dflash_8gb

model:
  id: Qwen/Qwen3-4B
  weight_dtype: bfloat16

hardware:
  gpu_vram_gib: 7.4506             # 8e9 bytes: the assignment's "8 GB" read conservatively (configs/studies/assignment.yaml)
  cpu_ram_gib: 29.8                # 32e9 bytes
  cpu_ram_source: "requirement, not a measurement: the orchestrator's minimum host RAM for Qwen3-4B (host_requirements in configs/studies/assignment.yaml); the rented host's MemTotal is recorded in environment/host.json"
  pcie_gb_per_s: 12.0
  pcie_source: "assumption, unmeasured: effective pinned host-to-device copy rate (PCIe 4.0 x16 peak is ~31.5 GB/s;
    laptop links and WSL2 are typically far lower)"
  copy_compute_overlap: true       # copy stream prefetches layer i+1 while layer i computes (2 buffers)

runtime:
  cuda_context_gib: 0.5            # estimate: CUDA context + cuBLAS workspace, outside the PyTorch allocator
  allocator_overhead: 0.10         # estimate: max_memory_reserved / max_memory_allocated - 1
  cpu_process_gib: 2.0             # estimate: Python + torch/CUDA host libraries + transformers + tokenizer + data
  safety_margin: 0.10              # fraction of each limit kept for unquantified allocations

grpo:                              # configs/default.yaml values, except micro_batch_size
  prompt_batch_size: 5             # B
  group_size: 6                    # G
  rollout_batch_size: 30           # sequences per generate() call (B*G: one call per rollout batch)
  micro_batch_size: 6              # qwen3_4b_final.yaml training.micro_batch_size 6: B*G = 30 rows as 5 chunks of 6
                                   # (was 30 = null, one chunk, before 2026-11-18)
  prompt_tokens: 100               # longest tokenized prompt over train/validation/test (data/sentiment.json)
  generation_tokens: 4             # max_new_tokens
  num_iterations: 1                # K updates per rollout batch
  reference_logprobs: false        # beta = 0: no reference-model forward

lora:
  rank: 32
  targets: last2-attention         # resolved with qwen_grpo.model.target_modules on a meta-device skeleton
  dtype: float32
  optimizer: adamw

streaming:
  resident_decoder_layers: 0       # baseline: everything streamed
  gpu_layer_buffers: 2             # current + prefetched layer
  weight_placement: pinned_cpu     # pinned_cpu | pageable_cpu
  pinned_allocation: per_layer     # one pinned block per layer (per_layer) or per tensor (per_tensor)
  non_decoder_placement: gpu       # embedding (= tied LM head) and final norm stay on GPU
  loading_copy: shard              # tensor | shard | model: largest pageable copy alive while filling pinned memory
  schedule: microbatch_major       # the engine streams every layer per micro-batch (docs/architecture.md): 5 x 6
                                   # rows means 5 weight streams per old-log-prob and per update pass
  activation_checkpoints: gpu      # gpu | cpu
  kv_cache: gpu                    # gpu | cpu
  logits: response_only            # response_only (logits_to_keep = R+1) | full_sequence

evaluation:
  examples: 128                    # data.val_subset of qwen3_4b_final.yaml (subset evaluation every 20 steps; plain greedy)
  batch_size: 16                   # qwen3_4b_final.yaml evaluation.batch_size (was 32 before 2026-11-18)
  score_batch_size: 8
  generation_tokens: 4
  during_training: true            # AdamW state stays allocated

merge:
  strategy: tensorwise             # tensorwise | shardwise
  device: cpu                      # qwen_grpo/export/merge.py merges on the CPU and never touches a GPU

dflash:
  enabled: true                    # qwen3_4b_final.yaml (and _lr0) enable DFlash rollouts: drafter resident in every phase
  estimate: true
  draft_model_id: z-lab/Qwen3-4B-DFlash-b16
