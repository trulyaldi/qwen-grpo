[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-grpo"
version = "0.2.0"
description = "GRPO + LoRA for Qwen3 with custom L2L layer streaming, disk streaming, DFlash rollouts and streamed merge"
readme = "README.md"
requires-python = ">=3.12"
# Pinned in requirements.txt (torch comes from the CUDA wheel index); `pip install -e . --no-deps` after it.
dependencies = []

[project.scripts]
qwen-grpo = "qwen_grpo.cli:main"

[tool.setuptools.packages.find]
include = ["qwen_grpo*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
