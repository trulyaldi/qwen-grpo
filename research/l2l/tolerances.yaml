# Acceptance thresholds of the L2L lab (qwen_grpo/lab.py), by case -> candidate backend -> dtype -> quantity.
# A comparison passes iff shapes and dtypes match, both tensors are finite, and
#     max|got - ref| <= atol + rtol * max|ref|.
# require_nonzero: the reference must not be identically zero (a zero gradient makes the comparison powerless).
# A quantity without an entry cannot be judged: the experiment fails. Thresholds are set from documented evidence
# before an acceptance run, and are never widened to make a failing run pass (research/l2l/protocol.md).

fixture_equivalence:
  resident:
    float32:
      why: >-
        Resident vs resident: the same code on the same kernels, with the same CPU thread count (fixtures.THREADS) and
        reduction order, gives bitwise identical results. Measured in Ticket 00 (tests/test_fixtures.py), so any
        difference is a defect, not rounding.
      quantities:
        logits: {atol: 0.0, rtol: 0.0}
        logp: {atol: 0.0, rtol: 0.0}
        loss: {atol: 0.0, rtol: 0.0}
        grads: {atol: 0.0, rtol: 0.0, require_nonzero: true}
        final_lora: {atol: 0.0, rtol: 0.0}
        optimizer: {atol: 0.0, rtol: 0.0}
        updates: {atol: 0.0, rtol: 0.0}
  # l2l_sync / l2l_async thresholds are added by Tickets 03-08, each with its numerical justification.

store_equivalence:
  l2l_sync:
    float32:
      why: >-
        The weight store copies bytes and re-points parameters; it performs no arithmetic. Stored tensors must equal
        the fixture's bitwise, and the unchanged resident code on store-backed parameters (CPU, same kernels and
        thread count) must reproduce the saved reference bitwise.
      quantities:
        weights: {atol: 0.0, rtol: 0.0}
        logits: {atol: 0.0, rtol: 0.0}
        logp: {atol: 0.0, rtol: 0.0}
        loss: {atol: 0.0, rtol: 0.0}
        grads: {atol: 0.0, rtol: 0.0, require_nonzero: true}
        final_lora: {atol: 0.0, rtol: 0.0}
        optimizer: {atol: 0.0, rtol: 0.0}
        updates: {atol: 0.0, rtol: 0.0}

forward_equivalence:
  l2l_sync:
    float32: &forward_exact
      why: >-
        Same device, same weight bytes (copied, never converted), same shapes, same kernels: the streamed layer runs the
        unchanged HF/PEFT module on views of a 256 B-aligned buffer, so cuBLAS / CPU kernel selection cannot differ from
        the resident run on alignment. Every operation is deterministic for a fixed shape on one stream, so any
        difference is a defect (wrong layer, stale buffer, wrong LoRA), not rounding. A disclosed pilot measured 0 on
        CPU and CUDA before this threshold was recorded.
      quantities:
        logits: {atol: 0.0, rtol: 0.0}
        layers: {atol: 0.0, rtol: 0.0}
    bfloat16: *forward_exact
  l2l_async:
    same_as: l2l_sync
    why: >-
      Ticket 08. The prefetching executor copies the same slab bytes into a pool buffer (on a transfer stream instead
      of the compute stream) and runs the same layer modules on the same views, shapes and kernels; streams and CUDA
      events change only when the bytes arrive, never which bytes or which arithmetic. Buffer ownership (copy after
      the previous readers' free event, compute after the copy's ready event) and verify mode (each use checks the
      buffer holds the intended layer) make a stale or overwritten buffer a defect, not rounding. So the synchronous
      thresholds apply unchanged.

gradient_equivalence:
  l2l_sync:
    float32: &backward_exact
      why: >-
        Ticket 04 (docs/l2l/04_checkpointed_backward.md). Same device, same weight bytes, same shapes. The checkpointed
        node recomputes each decoder layer from its saved input with the same kernels, so the recomputed layer graph
        equals the resident graph's segment bitwise (checked by the node's checksum), and autograd.grad over that
        segment runs the same backward kernels on the same operands in the same order as the resident backward:
        within a layer each LoRA parameter is used once, and the incoming dL/dhidden is the resident one by induction
        from the last layer. Micro-batch accumulation adds the same per-micro-batch gradients into .grad in the same
        order. So any difference is a defect (a missing or stale gradient, wrong weights, a wrong boundary), not
        rounding, provided the resident backward is itself deterministic; the case checks that by running the
        reference twice (reference_integrity) and fails rather than passes otherwise. A disclosed CPU pilot measured
        0 before this threshold was recorded.
      quantities:
        loss: {atol: 0.0, rtol: 0.0}
        logits: {atol: 0.0, rtol: 0.0}
        grads: {atol: 0.0, rtol: 0.0, require_nonzero: true}
        hidden_grads: {atol: 0.0, rtol: 0.0, require_nonzero: true}
    bfloat16: *backward_exact
  l2l_async:
    same_as: l2l_sync
    why: >-
      Ticket 08. The prefetching executor copies the same slab bytes into a pool buffer (on a transfer stream instead
      of the compute stream) and runs the same layer modules on the same views, shapes and kernels; streams and CUDA
      events change only when the bytes arrive, never which bytes or which arithmetic. Buffer ownership (copy after
      the previous readers' free event, compute after the copy's ready event) and verify mode (each use checks the
      buffer holds the intended layer) make a stale or overwritten buffer a defect, not rounding. So the synchronous
      thresholds apply unchanged.

logprob_equivalence:
  # Candidates: the chunked output head (resident and L2L) and L2L with the full head, each against the full-logits
  # resident reference at the same parameters. L2L itself is exact (gradient_equivalence); the chunked head changes
  # only the fp32 summation order of (a) the log-sum-exp over the V vocabulary rows and (b) dL/dh = sum_v dL/dz_v W_v.
  # Every log-prob is computed in fp32 for both dtypes (response_logprobs upcasts), so (a) is an fp32 error in both.
  # A disclosed pilot measured the errors before these thresholds were recorded (docs/l2l/05_output_head.md); the
  # thresholds below follow from the derivations, not from the measured values.
  l2l_sync:
    float32:
      why: >-
        logp: atol 1e-4. A reordered fp32 sum of V <= 151,936 positive terms has a relative error far below 1e-4, and
        log turns a relative error of the sum into an absolute error of the log-prob. The full-logits reference's own
        error against an fp64 computation is ~2e-5 at V = 151,936. So 1e-4 bounds the disagreement of two fp32
        orderings, and it is 1/2000 of the clip range eps = 0.2, so no clipping decision can hinge on it except a
        ratio within 1e-4 of 1 +- eps. loss: atol 4e-4, derived from logp: the per-token surrogate is ratio * A,
        ratio = exp(logp - old) with both logp and old shifted by <= 1e-4, so |d ratio| <= e^{2e-4} - 1 ~ 2e-4, and
        |A| <= sqrt(2) for G = 3 population-std advantages: 2e-4 * 1.42 * (1 + eps) < 4e-4, and the mean over tokens
        and sequences does not increase it. Gradients (LoRA, head input, decoder-layer outputs): rtol 1e-4 of the
        tensor's largest reference magnitude. dL/dz differs by at most the logp-level error times the softmax, and
        dL/dh is an fp32 sum over V reordered by chunk; propagated through the unchanged layer backward, the relative
        perturbation stays at fp32 summation level, orders of magnitude below 1e-4.
      quantities:
        logp: {atol: 1.0e-4, rtol: 0.0}
        loss: {atol: 4.0e-4, rtol: 0.0}
        grads: {atol: 0.0, rtol: 1.0e-4, require_nonzero: true}
        head_grads: {atol: 0.0, rtol: 1.0e-4, require_nonzero: true}
        hidden_grads: {atol: 0.0, rtol: 1.0e-4, require_nonzero: true}
    bfloat16:
      why: >-
        logp and loss: as for float32 (the log-softmax is computed in fp32 from the same bf16 logits: the chunk matmul
        rounds each logit to bf16 exactly as lm_head does). Gradients: rtol 2^-6 of the tensor's largest reference
        magnitude. The reference casts the fp32 dL/dz to bf16 and rounds the fp32-accumulated dL/dh to bf16 once; the
        chunked head does the same, but on fp32 values summed in another order, so a value next to a bf16 rounding
        boundary can round to the neighbouring bf16 number: one ulp, at most 2^-7 of the element's magnitude. Such
        one-ulp flips enter the bf16 layer backward, where an output element combines them, so 2 ulps at the largest
        magnitude, 2^-6, is allowed. An error of the method (a missing chunk, an unnormalized logit, a wrong row)
        changes gradients by O(1) relative, far above this bound.
      quantities:
        logp: {atol: 1.0e-4, rtol: 0.0}
        loss: {atol: 4.0e-4, rtol: 0.0}
        grads: {atol: 0.0, rtol: 0.015625, require_nonzero: true}
        head_grads: {atol: 0.0, rtol: 0.015625, require_nonzero: true}
        hidden_grads: {atol: 0.0, rtol: 0.015625, require_nonzero: true}

generation_equivalence:
  # Paths: transformers generate (reference), the streamed generator with the plain layer call (resident) and with
  # L2L weight streaming (streamed), and the resident full-prefix forward without a cache (prefix).
  # A disclosed pilot measured these before they were recorded (docs/l2l/06_generator.md).
  l2l_sync:
    float32: &generation
      why: >-
        greedy_sequences, cached_logits, sampled_probs: 0. The generator calls HF's own embedding, mask builder
        (create_causal_mask with a cache reporting the same sizes as DynamicCache), rotary embedding, decoder layers
        and head, with the same shapes per step. The KV cache hands attention new contiguous tensors, as
        DynamicCache's torch.cat does. The softmax / multinomial / argmax are those of GenerationMixin._sample. L2L
        streams the same weight bytes (Ticket 03). Same kernels on the same operands give the same bits, so any
        difference is a defect (position, mask, cache, LoRA), not rounding. The KV cache on the CPU only moves bytes.
        prefix_logits: the full-prefix forward computes the same function with other shapes (the query block is T
        columns instead of 1), so kernels reduce in another order. fp32: rtol 1e-5 of the step's largest |logit|,
        accumulation-order level for dot products of length <= hidden size through a few layers. bf16: every
        bf16-rounded op output may land one ulp (<= 2^-8 relative) apart, and the head mixes them; 4 ulps at the
        largest logit, rtol 2^-6, is allowed. prefix_probs, derived: with |dz| <= delta,
        |dp_i| <= p_i (e^{2 delta} - 1). The case refuses references with |logit| > 16, so delta <= 16 rtol_logits:
        fp32 delta <= 1.6e-4, e^{3.2e-4} - 1 < 4e-4 (rtol of the largest probability); bf16 delta <= 0.25,
        e^{0.5} - 1 < 0.65. The bf16 bound is loose by construction; the bitwise cached comparisons carry the power.
      quantities:
        greedy_sequences: {atol: 0.0, rtol: 0.0}
        cached_logits: {atol: 0.0, rtol: 0.0}
        sampled_probs: {atol: 0.0, rtol: 0.0}
        prefix_logits: {atol: 0.0, rtol: 1.0e-5}
        prefix_probs: {atol: 0.0, rtol: 4.0e-4}
    bfloat16:
      why: >-
        As float32 (see there) for greedy_sequences, cached_logits, sampled_probs (0) and the derivations;
        prefix_logits rtol 2^-6 and prefix_probs rtol 0.65 for bf16.
      quantities:
        greedy_sequences: {atol: 0.0, rtol: 0.0}
        cached_logits: {atol: 0.0, rtol: 0.0}
        sampled_probs: {atol: 0.0, rtol: 0.0}
        prefix_logits: {atol: 0.0, rtol: 0.015625}
        prefix_probs: {atol: 0.0, rtol: 0.65}
  l2l_async:
    same_as: l2l_sync
    why: >-
      Ticket 08. The prefetching executor copies the same slab bytes into a pool buffer (on a transfer stream instead
      of the compute stream) and runs the same layer modules on the same views, shapes and kernels; streams and CUDA
      events change only when the bytes arrive, never which bytes or which arithmetic. Buffer ownership (copy after
      the previous readers' free event, compute after the copy's ready event) and verify mode (each use checks the
      buffer holds the intended layer) make a stale or overwritten buffer a defect, not rounding. So the synchronous
      thresholds apply unchanged.

update_equivalence:
  l2l_sync:
    float32:
      why: >-
        Ticket 07. Both sides run the same training.grpo_update (GRPO loss, micro-batch scaling, AdamW) on the same
        fixed rollouts, advantages and old log-probs; only the log-prob function differs, and the L2L one (checkpointed
        layers + full output head) gives bitwise-equal log-probs and gradients (forward_equivalence,
        gradient_equivalence; the head path equals compute_logprobs bitwise, Ticket 05). AdamW then applies the same
        kernels to the same gradients and state, so every logged statistic, update and optimizer-state tensor is
        bitwise equal; any difference is a defect (a stale or missing gradient, a wrong advantage, a changed old
        log-prob, a different parameter object). A disclosed CPU pilot measured 0 before this was recorded. This table
        is used for the fp32 model and for the bf16-base model (bf16 frozen weights, fp32 adapters): the argument does
        not depend on the dtype.
      quantities:
        logp: {atol: 0.0, rtol: 0.0}
        loss: {atol: 0.0, rtol: 0.0}
        stats: {atol: 0.0, rtol: 0.0}
        grads: {atol: 0.0, rtol: 0.0, require_nonzero: true}
        updates: {atol: 0.0, rtol: 0.0}
        optimizer: {atol: 0.0, rtol: 0.0}
  l2l_async:
    same_as: l2l_sync
    why: >-
      Ticket 08. The prefetching executor copies the same slab bytes into a pool buffer (on a transfer stream instead
      of the compute stream) and runs the same layer modules on the same views, shapes and kernels; streams and CUDA
      events change only when the bytes arrive, never which bytes or which arithmetic. Buffer ownership (copy after
      the previous readers' free event, compute after the copy's ready event) and verify mode (each use checks the
      buffer holds the intended layer) make a stale or overwritten buffer a defect, not rounding. So the synchronous
      thresholds apply unchanged.
