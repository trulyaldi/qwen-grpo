# Research hypotheses of the L2L + streaming work. kind: correctness (explicit numerical acceptance thresholds,
# research/l2l/tolerances.yaml) or performance (repeated timings with uncertainty). status: untested | SUPPORTED |
# NOT_SUPPORTED | INCONCLUSIVE (lab.hypothesis_result), updated only from saved results under research/l2l/experiments/
# whose execution_status is PASS (cite the run names in `evidence`). A completed experiment is not a supported hypothesis.

H01:
  statement: Synchronous L2L produces the same logits as resident Qwen3 execution.
  kind: correctness
  criterion: >-
    Written before the Ticket 03 acceptance run (after a disclosed pilot that compared HF and L2L logits only; see
    docs/l2l/03_sync_forward.md). Case forward_equivalence: on the same device, with the same weights and inputs, the
    synchronous L2L forward's logits equal the Hugging Face resident forward's, and its output after every decoder layer
    equals the explicit resident forward's, within research/l2l/tolerances.yaml (forward_equivalence: 0 for every
    quantity and dtype). Grid: both fixture shapes x eager/sdpa x fp32/bf16 x LoRA (plain model, adapter disabled,
    last2-attention, every projection of every layer) x 1 or 2 weight buffers x unpadded and left-padded inputs of
    several lengths x all, last-k and index-selected logit columns. The explicit resident forward must equal HF bitwise
    (reference integrity). Bounded residency (an execution requirement, not a threshold): at every decoder-layer call
    every frozen weight a kernel reads lies in the weight-buffer pool, the layer's weights are back in their CPU slab
    right after the call, the PyTorch-allocated device memory before each layer's copy is identical for every layer
    after the first, and after the forward it equals its value before the forward. NOT_SUPPORTED if any comparison
    exceeds its threshold.
  tickets: ["03"]
  status: SUPPORTED  # tiny random Qwen3 models, forward only, use_cache=False; not yet real weights or generation
  evidence: [t03_forward_equivalence]
H02:
  statement: Checkpointed L2L backward produces the same LoRA gradients as resident autograd.
  kind: correctness
  criterion: >-
    Written before the Ticket 04 acceptance run (after a disclosed CPU pilot; see docs/l2l/04_checkpointed_backward.md).
    Case gradient_equivalence: on the same device, with the same weights and inputs, the GRPO loss of the fixture
    rollouts (two micro-batches, one per prompt group) is back-propagated through the checkpointed L2L executor and
    through the resident explicit forward. Every LoRA parameter's .grad after the first micro-batch and after the
    second was accumulated, every available dL/d(decoder-layer output), the loss and the logits agree within
    research/l2l/tolerances.yaml (gradient_equivalence: 0 for every quantity and dtype); every reference gradient is
    nonzero. Grid: both fixture shapes x eager/sdpa x fp32/bf16 x LoRA (every projection) on the final layer, the last
    two, a middle one, the first and last, and several distributed layers x 1 or 2 weight buffers. Reference integrity:
    explicit resident logits equal HF bitwise, and the resident gradients are bitwise repeatable. Execution
    requirements: no autograd tensor saved by the forward lies in a weight buffer, backward reloads exactly the layers
    from the first adapted one upward, LoRA Parameter and optimizer identities and the store are unchanged.
    NOT_SUPPORTED if any comparison exceeds its threshold or a candidate gradient is missing.
  tickets: ["04"]
  status: SUPPORTED  # tiny random Qwen3 models on CPU and CUDA (RTX 3050 Ti); one real Qwen3-0.6B step bitwise (real_step_*)
  evidence: [t04_gradient_equivalence_cpu, t04_gradient_equivalence_cuda]
H03:
  statement: Memory-efficient output-head computation preserves GRPO log-probabilities and gradients.
  kind: correctness
  criterion: >-
    Written before the Ticket 05 acceptance run (after a disclosed CPU pilot; see docs/l2l/05_output_head.md). Case
    logprob_equivalence: at the same parameters and inputs, the chunked output head (resident and with the L2L
    executor) and L2L with the full head give selected-token log-probabilities (old and current), the GRPO loss
    reported by the unchanged training.grpo_update, every LoRA gradient, the head-input gradient and every
    decoder-layer-output gradient that agree with the full-logits resident reference within research/l2l/tolerances.yaml
    (logprob_equivalence: logp 1e-4, loss 4e-4 absolute; gradients 1e-4 (fp32) / 2^-6 (bf16) of the largest reference
    magnitude); every reference gradient is nonzero. Grid: V in {64, 1000, 151936} x fp32/bf16 x R in {1, 4, 16} x
    whole batch / micro-batches of 2 x two chunk sizes per V (one leaving a remainder chunk) x 4 AdamW iterations
    (reference snapshots; some tokens must clip). Reference integrity: the full-logits path equals
    policy.compute_logprobs bitwise, and the probe loss equals the training run's. Execution requirements: every side
    passes the unchanged iteration-0 old/current check (training.INIT_TOL), and the chunked head's largest allocation
    is bounded by its chunk and its saved bytes do not grow with V. NOT_SUPPORTED if any comparison exceeds its
    threshold.
  tickets: ["05"]
  status: SUPPORTED  # v2 at 6657edf (CPU, tiny models, clean tree): all 20304 comparisons within the unchanged
  # thresholds; the raw_logit fault run FAILs as required. v1 (t05_logprob_equivalence_cpu) stays NOT_SUPPORTED by its
  # rule: its 120 failures were zero-reference power-rule failures (max_abs 0), fixed in 5300146 before this re-run.
  # The chunked head is still not used for training (config.unimplemented: vocab_chunk_size); no GPU evidence.
  evidence: [t05_logprob_equivalence_cpu, t05_logprob_equivalence_cpu_v2, t05_logprob_equivalence_raw_logit_v2]
H04:
  statement: Streamed generation follows the same target-policy distribution as resident generation.
  kind: correctness
  criterion: >-
    Written before the Ticket 06 acceptance run (after a disclosed CPU pilot; see docs/l2l/06_generator.md). Case
    generation_equivalence: on the same device with the same weights and prompts, the streamed generator (plain layer
    call and L2L weight streaming, KV cache on the compute device and on the CPU) gives greedy token sequences and
    per-step next-token logits equal to transformers generate()'s, and next-token probabilities along hf-sampled
    trajectories (teacher-forced) equal to hf's sampling distribution (tolerance 0); cached decoding agrees with the
    resident full-prefix forward within the derived rounding bound (generation_equivalence in tolerances.yaml), and
    greedy tokens agree wherever the top-1 / top-2 margin exceeds twice that bound. Grid: both fixture shapes x
    eager/sdpa x fp32/bf16, LoRA on the first and last layers, two sets of left-padded prompts of different lengths,
    plus an EOS-boosted model (rows ending in EOS with a padded tail are required) and a real-vocabulary model with
    non-thinking Qwen3 chat prompts. Execution requirements: one weight load per layer per generated token, the KV
    cache equals its analytic size, |logits| <= 16 in every reference. NOT_SUPPORTED if any comparison fails.
  tickets: ["06"]
  status: SUPPORTED  # tiny random models on CPU and CUDA (one with the real vocabulary and chat prompts); real Qwen3-0.6B rollouts equal HF's (real_step_*)
  evidence: [t06_generation_equivalence_cpu, t06_generation_equivalence_cuda]
H05:
  statement: A complete streamed GRPO + LoRA optimizer update is numerically equivalent to a resident update.
  kind: correctness
  criterion: >-
    Written before the Ticket 07 acceptance run (after a disclosed CPU pilot; see docs/l2l/07_update.md). Case
    update_equivalence: on the fixed Ticket 00 rollout batch (ids, completion masks, rewards, advantages, old
    log-probs), from identical base weights, LoRA weights and AdamW state, ITERATIONS = 3 complete training.grpo_update
    calls through backend.L2LBackend give current-policy log-probs, the GRPO loss, clipping statistics, every LoRA
    gradient, every parameter update and every AdamW state tensor equal to those through backend.ResidentBackend within
    research/l2l/tolerances.yaml (update_equivalence: 0); every reference gradient is nonzero. Grid: both fixture
    shapes x {fp32 model, bf16 base with fp32 adapters} x micro-batch size {all, 1, 2, 4} x AdamW state {fresh, warm}.
    Reference integrity: the rollout fixture equals the saved Ticket 00 one. Execution requirements: frozen parameter
    hashes unchanged on both sides and equal between them, old log-probs unchanged across the iterations, finite
    gradients, iteration-0 init_diff 0, Parameter identities kept, tokens clipped after iteration 0 (power).
    NOT_SUPPORTED if any comparison fails.
  tickets: ["07"]
  status: SUPPORTED  # tiny random models on CPU and CUDA; trainer integration bitwise on CPU (tests/test_backend.py); two real Qwen3-0.6B GRPO updates bitwise on CUDA (real_step_*); full 100-step Qwen3-0.6B training runs resident vs L2L identical on CUDA (compare_*)
  evidence: [t07_update_equivalence_cpu, t07_update_equivalence_cpu_v2, t07_update_equivalence_cuda_v2, real_step_20261117T063325Z, real_step_20261117T063548Z, compare_qwen_resident_short_vs_qwen_l2l_short, compare_qwen_resident_vs_qwen_l2l]  # t07_update_equivalence_cuda: execution FAIL (lab design, fixed after it; docs/l2l/07_update.md)
H06:
  statement: Double-buffered asynchronous prefetching reduces execution time without changing numerical results.
  kind: performance  # with a correctness precondition: every equivalence test still passes under l2l_async
  prediction: candidate_faster  # candidate l2l_async vs reference l2l_sync: median-ratio 95% CI entirely below 1
  criterion: >-
    Written before the Ticket 08 GPU runs (docs/l2l/08_prefetch.md). Correctness precondition: under an l2l_async
    config, forward_equivalence, gradient_equivalence, generation_equivalence and update_equivalence pass with the
    unchanged thresholds (tolerances.yaml: same_as l2l_sync, justified), with verify mode on (every use checks that its
    buffer holds the intended layer), and the unsafe_reuse fault is detected. Performance: case prefetch_timing on the
    real Qwen3-0.6B (bf16, configs/qwen.yaml batch and LoRA), sync and async executors on the same model, store and
    inputs, sides interleaved after warmup; SUPPORTED iff the bootstrap 95% CI of the async/sync median ratio of the
    whole GRPO step lies entirely below 1, NOT_SUPPORTED iff entirely at or above 1, INCONCLUSIVE otherwise. Overlap is
    reported only as measured from CUDA event timestamps (copy and compute intervals running at once), never inferred
    from the use of a second stream.
  tickets: ["08"]
  status: untested
  evidence: []
H07:
  statement: Bounded layer residency reduces GPU weight-memory dependence on total model depth.  # Ticket 02
  statement_ticket11: GPU weight residency remains bounded as model depth increases.
  kind: memory  # GPU weight memory vs depth at a fixed layer shape and number of buffers
  prediction: streamed_constant_resident_increasing
  criterion_ticket11: >-
    Written before the Ticket 11 runs (docs/l2l/11_profiling.md). Case depth_residency: tiny Qwen3 models of one layer
    shape at depths 2, 4, 8, 16, 32 on one GPU; SUPPORTED iff the synchronous streamed no-grad forward's peak of
    PyTorch-allocated memory (weights + buffers + activations) is identical at every depth and the resident one strictly
    increases (the prediction rule above), with the asynchronous executor's peak also identical across depths
    (execution requirement). Training-step peaks are recorded with the analytic size of the per-layer activation
    checkpoints, the only depth-dependent streamed term by design.
  criterion: >-
    Written before the Ticket 02 run. SUPPORTED iff, over every measured depth, the streamed peak of PyTorch-allocated
    GPU memory (store build + every layer copied through the fixed buffer pool) is identical to the byte, and the
    peak with the same decoder layers resident on the GPU strictly increases with depth. NOT_SUPPORTED if the streamed
    peak differs between any two depths. INCONCLUSIVE otherwise. Allocator statistics only (diagnostic grade): this
    is a statement about PyTorch allocations, not about process-level or device-level memory.
  tickets: ["02", "11"]
  status: SUPPORTED  # Ticket 02 statement only: copy-only (layers copied through the buffers, not executed), allocator
  # statistics (diagnostic grade); covers the store/buffer mechanism and the absence of a hidden GPU copy, not L2L
  # execution (activations, workspace: Ticket 03+). The Ticket 11 statement is untested.
  evidence: [t02_store_depth]
H08:
  statement: An interrupted and resumed run preserves the same committed training sequence as an uninterrupted run.
  kind: correctness
  criterion: >-
    Written before the Ticket 09 evidence runs (docs/l2l/09_streaming.md). scripts/resume_experiment.py: a streaming run A
    without interruption and, for each injected crash point (after reading a prompt, after generating rollouts, during an
    applied but uncommitted GRPO update, during checkpoint publication before and after COMMIT.json, immediately after
    a published checkpoint), a run B that crashes there and resumes from its latest valid checkpoint. SUPPORTED iff for
    every B: the committed training rows (step, attempt, prompt ids, rollout hash, rewards, loss, norms, iteration,
    clipping), zero-signal attempts, subset evaluations, attempt and optimizer-step counters, the committed rollout
    records (group ids, policy versions, (epoch, position, sample id) occurrences, generated tokens, rewards) and every
    common checkpoint's adapter and AdamW state equal A's exactly; no sample occurs twice in an epoch and every
    completed epoch covers every sample; no interrupted publication is left and every remaining checkpoint validates.
    A corrupted checkpoint must be rejected in favour of the last valid one (tests/test_streaming.py).
  tickets: ["09"]
  status: SUPPORTED  # CPU, tiny random Qwen3 (real tokenizer and data); the real-model run is study entry H08.resume_qwen3_0.6b (configs/studies/assignment.yaml)
  evidence: [t09_resume_tiny_cpu]
H09:
  statement: Tensor-by-tensor merging preserves the adapter-attached model's behaviour.
  kind: correctness
  criterion: >-
    Written before the Ticket 10 evidence runs (after a disclosed CPU pilot; docs/l2l/10_merge.md). Case
    merge_equivalence: export.merge.stream_merge merges the adapter into the base checkpoint tensor by tensor on the CPU
    (a child process that never initializes CUDA); the merged checkpoint, loaded on its own as a plain Hugging Face
    model, and the adapter-attached model run through the L2L engine on identical validation prompts. SUPPORTED iff for
    every variant (tiny fp32, tiny bf16; the real Qwen3-0.6B bf16 with the runs/qwen step-90 adapter) every merged
    tensor is one correct rounding of W0 + (alpha/r) B A (within half an ulp element by element; tolerances.yaml
    merge_equivalence), merged logits agree with the adapter-attached model's within the dtype's bound (fp32 1e-4,
    bf16 2^-4 of the largest logit), greedy tokens agree except at near-ties, the adapter's own effect is at least
    100 (fp32) / 10 (bf16) times the merge discrepancy, every adapted tensor changed, the merged checkpoint loads
    independently with its tied embedding / head and no LoRA tensors, and on a GPU the merged evaluation's peak
    allocated memory stays below the model's size.
  tickets: ["10"]
  status: untested  # tiny fp32/bf16 variants PASS at 6657edf (t10_merge_equivalence_tiny); the criterion needs every
  # variant, and the real Qwen3-0.6B one (t10_merge_equivalence_qwen3_0.6b, CUDA) has not run
  evidence: [t10_merge_equivalence_tiny]
H10:
  statement: DFlash reduces target-model execution overhead while preserving the current LoRA policy's output distribution.
  kind: performance  # with a correctness precondition: distribution preservation
  criterion: >-
    Written before the Ticket 12 runs (docs/l2l/12_dflash.md). Correctness (tests/test_dflash.py, CPU, tiny models with
    random and oracle drafters): DFlash greedy outputs equal plain streamed generation exactly, including partial
    acceptance and rejections; sampled outputs follow the target's exact law (chi-square on the joint law of the first
    two tokens, reject at p < 1e-3, plain sampler as control). Real model (scripts/dflash_bench.py, Qwen3-4B, L2L,
    z-lab/Qwen3-4B-DFlash-b16, LoRA policies at B scales 0 / 0.01 / 0.03): greedy tokens equal plain generation at every
    policy (the verifier is the current LoRA policy). The efficiency claim is SUPPORTED only where measured target
    passes per generated token are below 1 and the DFlash generation and GRPO step wall times are below plain ones in
    the same run; otherwise NOT_SUPPORTED, with the measured bottleneck reported. The 8 GB budget needs assignment-grade
    evidence (H11's rule).
  tickets: ["12"]
  status: untested
  evidence: []
H11:
  statement: The complete Qwen3-4B system respects the 8 GB GPU-memory budget.
  kind: performance  # a memory budget, judged on process-level evidence
  criterion: >-
    Written before the Ticket 11 runs. scripts/profile_run.py with configs/experiments/qwen3_4b_l2l.yaml (budget 8 GiB):
    setup, rollout, old log-probs, differentiable forward, backward, optimizer step, streaming merge and evaluation run
    under execution.profiler with nvidia-smi sampled throughout (raw output kept) and the memory guard armed. SUPPORTED
    iff the run completes with no guard violation and assignment-grade evidence (a numeric per-process nvidia-smi
    reading in every sample, not under WSL2); NOT_SUPPORTED iff the guard fires or a phase's process-level memory
    exceeds 8 GiB; INCONCLUSIVE (never SUPPORTED) when the evidence is only diagnostic or the run cannot complete for a
    reason other than GPU memory (e.g. CPU RAM, which the saved prediction already expects to exceed its budget).
  tickets: ["11"]
  status: untested
  evidence: []
H12:
  statement: The trained policy has meaningfully learned the intended task rather than merely changing parameters or exploiting the reward.
  kind: correctness  # scientific validation: held-out evaluation with confidence intervals and negative controls
  criterion: >-
    Written before the Ticket 13 run (docs/l2l/13_final.md). scripts/final_eval.py on the held-out test split (1066
    examples, never used in training; checked by text): SUPPORTED iff the trained adapter's accuracy exceeds the base
    model's with the paired-bootstrap 95% CI entirely above 0, the merged model agrees with the adapter-attached one
    (merge_equivalence), the invalid-response rate does not rise and the prediction distribution does not collapse to
    one label (reward-exploitation checks), and the LR=0 control leaves the adapter and every test prediction
    unchanged. A rising reward curve or nonzero gradients alone never count. NOT_SUPPORTED otherwise.
  tickets: ["13"]
  status: untested
  evidence: []
