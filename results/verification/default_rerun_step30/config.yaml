run:
  name: default_rerun
model:
  name: Qwen/Qwen3-0.6B
  dtype: bfloat16
  thinking: false
lora:
  rank: 8
  alpha: 16
  dropout: 0.0
  targets: last2-attention
data:
  train_samples: 32
  val_subset: 160
  subset_seed: 42
training:
  batch_size: 2
  batch_mode: balanced
  group_size: 6
